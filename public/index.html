<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claudio</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #07040c;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'VT323', monospace;
      color: #e0c8d8;
    }

    /* ── 整体容器 ── */
    .console {
      width: 860px;
      display: flex;
      flex-direction: column;
    }

    /* ── 屏幕（上半部分，左右分栏） ── */
    .screen {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: 380px;
      border: 1px solid #3d1550;
      border-radius: 12px 12px 0 0;
      overflow: hidden;
      background: #09061a;
      box-shadow:
        0 0 40px rgba(180, 30, 90, 0.2),
        0 0 80px rgba(80, 0, 60, 0.12),
        inset 0 0 60px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    /* CRT 扫描线 */
    .screen::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 3px,
        rgba(0, 0, 0, 0.12) 3px, rgba(0, 0, 0, 0.12) 4px
      );
      pointer-events: none;
      z-index: 10;
    }

    /* ── 左屏：封面 + 曲名 + 歌单 ── */
    .screen-left {
      border-right: 1px solid #2a1040;
      display: flex;
      flex-direction: column;
      padding: 1.4rem 1.2rem 1rem;
      gap: 0.9rem;
      overflow: hidden;
    }

    .now-playing {
      display: flex;
      gap: 0.9rem;
      align-items: center;
      flex-shrink: 0;
    }

    .cover {
      width: 72px;
      height: 72px;
      border-radius: 6px;
      background: #150a28;
      border: 1px solid #3d1550;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 0 16px rgba(180, 30, 90, 0.2);
    }
    .cover img { width: 100%; height: 100%; object-fit: cover; }

    .track-meta { flex: 1; min-width: 0; }
    .track-name {
      font-size: 1.25rem;
      color: #f0d0e8;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-artist {
      font-size: 1rem;
      color: #5a2f58;
      margin-top: 0.1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .screen-divider {
      height: 1px;
      background: linear-gradient(to right, transparent, #2a1040, transparent);
      flex-shrink: 0;
    }

    .panel-label {
      font-size: 0.72rem;
      letter-spacing: 0.35em;
      color: #4a2550;
      flex-shrink: 0;
    }

    /* 歌单列表 */
    .playlist {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
    }
    .playlist::-webkit-scrollbar { width: 2px; }
    .playlist::-webkit-scrollbar-track { background: transparent; }
    .playlist::-webkit-scrollbar-thumb { background: #3a1540; border-radius: 1px; }

    .song-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.3rem 0.4rem;
      border-radius: 3px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .song-row:hover { background: #160822; }
    .song-row.playing {
      background: #1c0a2a;
      border-left: 2px solid #c42b65;
      padding-left: calc(0.4rem - 2px);
    }
    .song-row .num {
      font-size: 0.82rem;
      color: #3a1540;
      width: 1.1rem;
      text-align: right;
      flex-shrink: 0;
    }
    .song-row.playing .num { color: #c42b65; }
    .song-row .info { flex: 1; min-width: 0; }
    .song-row .s-name {
      font-size: 0.98rem;
      color: #b898b0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .song-row.playing .s-name { color: #f0d0e8; }
    .song-row .s-artist {
      font-size: 0.82rem;
      color: #4a2550;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-hint {
      font-size: 0.9rem;
      color: #2a1535;
      padding: 0.8rem 0;
      text-align: center;
    }

    /* ── 右屏：歌词 ── */
    .screen-right {
      display: flex;
      flex-direction: column;
      padding: 1.4rem 1.2rem 1rem;
      gap: 0.9rem;
      overflow: hidden;
    }

    .lyric-panel {
      flex: 1;
      overflow: hidden;
      position: relative;
      mask-image: linear-gradient(transparent, black 18%, black 82%, transparent);
      -webkit-mask-image: linear-gradient(transparent, black 18%, black 82%, transparent);
    }

    .lyric-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.7rem;
      transition: transform 0.4s ease;
    }

    .lyric-line {
      font-size: 1rem;
      color: #2e1535;
      text-align: center;
      line-height: 1.5;
      transition: color 0.3s, font-size 0.3s, text-shadow 0.3s;
      padding: 0 0.5rem;
    }
    .lyric-line.active {
      color: #c42b65;
      font-size: 1.1rem;
      text-shadow: 0 0 10px rgba(196, 43, 101, 0.5);
    }

    /* ── 控制栏 ── */
    .controls-bar {
      background: #0c0820;
      border: 1px solid #2a1040;
      border-top: none;
      padding: 0.65rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }

    .ctrl-btns {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      flex-shrink: 0;
    }

    button {
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'VT323', monospace;
      transition: color 0.15s, text-shadow 0.15s;
    }

    .ctrl-btn {
      font-size: 1.2rem;
      color: #4a2550;
      padding: 0.2rem;
    }
    .ctrl-btn:hover {
      color: #c42b65;
      text-shadow: 0 0 8px rgba(196, 43, 101, 0.6);
    }

    #btn-play {
      font-size: 1.7rem;
      color: #c42b65;
      text-shadow: 0 0 10px rgba(196, 43, 101, 0.5);
    }
    #btn-play:hover { text-shadow: 0 0 18px rgba(196, 43, 101, 0.9); }

    .progress-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.88rem;
      color: #4a2550;
    }

    progress {
      flex: 1;
      height: 2px;
      appearance: none;
      background: #2a1040;
      border-radius: 1px;
      cursor: pointer;
    }
    progress::-webkit-progress-bar { background: #2a1040; border-radius: 1px; }
    progress::-webkit-progress-value {
      background: #c42b65;
      border-radius: 1px;
      box-shadow: 0 0 5px rgba(196, 43, 101, 0.7);
    }

    .status-line {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.78rem;
      color: #3a1840;
      flex-shrink: 0;
    }
    .dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #2a1035;
    }
    .dot.on {
      background: #c42b65;
      box-shadow: 0 0 6px rgba(196, 43, 101, 0.9);
      animation: blink 2.5s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    /* ── 对话区 ── */
    .dialog-section {
      margin-top: 10px;
      background: #09061a;
      border: 1px solid #2a1040;
      border-radius: 0 0 12px 12px;
      padding: 1.1rem 1.5rem 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }

    .dj-label {
      font-size: 0.72rem;
      letter-spacing: 0.35em;
      color: #5a2558;
    }

    .dj-text {
      font-size: 1.15rem;
      color: #c0a0b8;
      line-height: 1.7;
      min-height: 2rem;
    }

    .chat-area {
      display: flex;
      gap: 0.5rem;
      border-top: 1px solid #1e0d2e;
      padding-top: 0.7rem;
    }

    input[type=text] {
      flex: 1;
      background: #07040c;
      border: 1px solid #2a1040;
      border-radius: 4px;
      color: #e0c8d8;
      padding: 0.48rem 0.8rem;
      font-size: 1.05rem;
      font-family: 'VT323', monospace;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type=text]::placeholder { color: #2e1535; }
    input[type=text]:focus { border-color: #c42b65; box-shadow: 0 0 8px rgba(196,43,101,0.15); }

    .send-btn {
      background: #130920;
      border: 1px solid #3d1550;
      border-radius: 4px;
      padding: 0.48rem 1.1rem;
      font-size: 0.95rem;
      color: #c42b65;
      letter-spacing: 0.1em;
      transition: background 0.15s, border-color 0.15s;
    }
    .send-btn:hover { background: #1e0d30; border-color: #c42b65; }

    audio { display: none; }

    /* ── 登录弹窗 ── */
    .login-overlay {
      position: fixed;
      inset: 0;
      background: rgba(7, 4, 12, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(4px);
    }
    .login-overlay.hidden { display: none; }

    .login-box {
      background: #09061a;
      border: 1px solid #3d1550;
      border-radius: 12px;
      padding: 2rem 2.5rem;
      text-align: center;
      width: 300px;
      box-shadow: 0 0 60px rgba(180, 30, 90, 0.25);
    }

    .login-title {
      font-size: 1.3rem;
      color: #f0d0e8;
      letter-spacing: 0.1em;
      margin-bottom: 0.4rem;
    }

    .login-sub {
      font-size: 0.85rem;
      color: #4a2550;
      margin-bottom: 1.2rem;
      letter-spacing: 0.05em;
    }

    .login-qr {
      width: 180px;
      height: 180px;
      background: #fff;
      border-radius: 8px;
      margin: 0 auto 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .login-qr img { width: 100%; height: 100%; }
    .login-qr .qr-placeholder {
      font-size: 0.85rem;
      color: #999;
      font-family: sans-serif;
    }

    .login-status {
      font-size: 0.95rem;
      color: #c42b65;
      min-height: 1.4rem;
      margin-bottom: 1rem;
    }

    .login-skip {
      font-size: 0.82rem;
      color: #2e1535;
      background: none;
      border: none;
      cursor: pointer;
      letter-spacing: 0.05em;
      font-family: 'VT323', monospace;
      transition: color 0.15s;
    }
    .login-skip:hover { color: #5a2f58; }
  </style>
</head>
<body>

<!-- 登录弹窗 -->
<div class="login-overlay hidden" id="login-overlay">
  <div class="login-box">
    <div class="login-title">// CLAUDIO</div>
    <div class="login-sub">登录网易云，获取你的专属歌单</div>
    <div class="login-qr" id="login-qr">
      <div class="qr-placeholder">加载中…</div>
    </div>
    <div class="login-status" id="login-status">等待扫描…</div>
    <button class="login-skip" id="login-skip">跳过，以游客身份收听</button>
  </div>
</div>

<div class="console">

  <!-- 屏幕 -->
  <div class="screen">

    <!-- 左：封面 + 曲名 + 歌单 -->
    <div class="screen-left">
      <div class="now-playing">
        <div class="cover" id="cover"><span>♪</span></div>
        <div class="track-meta">
          <div class="track-name" id="song-name">— —</div>
          <div class="track-artist" id="song-artist">—</div>
        </div>
      </div>
      <div class="screen-divider"></div>
      <div class="panel-label">// QUEUE</div>
      <div class="playlist" id="results">
        <div class="empty-hint">// 等待歌单 //</div>
      </div>
    </div>

    <!-- 右：歌词 -->
    <div class="screen-right">
      <div class="panel-label">// LYRICS</div>
      <div class="lyric-panel" id="lyric-panel">
        <div class="lyric-inner" id="lyric-inner">
          <div class="lyric-line" style="color:#1e0d25">// no lyrics //</div>
        </div>
      </div>
    </div>

  </div>

  <!-- 控制栏 -->
  <div class="controls-bar">
    <div class="ctrl-btns">
      <button class="ctrl-btn" id="btn-prev">⏮</button>
      <button id="btn-play">▶</button>
      <button class="ctrl-btn" id="btn-next">⏭</button>
    </div>
    <div class="progress-wrap">
      <span id="time-cur">0:00</span>
      <progress id="progress" value="0" max="100"></progress>
      <span id="time-total">0:00</span>
    </div>
    <div class="status-line">
      <span id="status-text">offline</span>
      <div class="dot" id="dot"></div>
    </div>
  </div>

  <!-- 对话框 -->
  <div class="dialog-section">
    <div class="dj-label">// CLAUDIO</div>
    <div class="dj-text" id="dj-say">和我说说你现在想听什么</div>
    <div class="chat-area">
      <input type="text" id="chat-input" placeholder="> 输入消息..." />
      <button class="send-btn" id="chat-send">SEND</button>
    </div>
  </div>

</div>

<audio id="player"></audio>

<script>
  const $ = id => document.getElementById(id)
  const player = $('player')

  let playlist = []
  let currentIndex = -1
  let isPlaying = false
  let ttsPlaying = false

  // ── 登录状态 ────────────────────────────────────────────────
  let ncmCookie = localStorage.getItem('ncm_cookie') || ''
  let userTaste = localStorage.getItem('ncm_taste') || ''
  let loginKey = ''
  let loginPollTimer = null

  function authHeaders() {
    return ncmCookie ? { 'x-ncm-cookie': ncmCookie } : {}
  }

  async function initLogin() {
    if (ncmCookie) return  // 已登录，不弹窗
    $('login-overlay').classList.remove('hidden')
    await loadQR()
  }

  async function loadQR() {
    $('login-status').textContent = '生成二维码…'
    $('login-qr').innerHTML = '<div class="qr-placeholder">加载中…</div>'
    clearInterval(loginPollTimer)
    try {
      const res = await fetch('/api/login/qr/new')
      const d = await res.json()
      loginKey = d.key
      $('login-qr').innerHTML = `<img src="${d.img}">`
      $('login-status').textContent = '用网易云 App 扫码'
      loginPollTimer = setInterval(pollLogin, 2000)
    } catch {
      $('login-status').textContent = '加载失败，请刷新重试'
    }
  }

  async function pollLogin() {
    try {
      const res = await fetch(`/api/login/qr/check?key=${loginKey}`)
      const d = await res.json()
      $('login-status').textContent = d.message
      if (d.code === 803) {
        clearInterval(loginPollTimer)
        ncmCookie = d.cookie
        localStorage.setItem('ncm_cookie', ncmCookie)
        $('login-status').textContent = '登录成功，加载你的歌单…'
        await fetchUserTaste()
        $('login-overlay').classList.add('hidden')
      } else if (d.code === 800) {
        clearInterval(loginPollTimer)
        await loadQR()
      }
    } catch {}
  }

  async function fetchUserTaste() {
    try {
      const res = await fetch('/api/user/taste', { headers: authHeaders() })
      if (res.ok) {
        const d = await res.json()
        userTaste = d.taste
        localStorage.setItem('ncm_taste', userTaste)
      }
    } catch {}
  }

  $('login-skip').addEventListener('click', () => {
    clearInterval(loginPollTimer)
    $('login-overlay').classList.add('hidden')
  })

  function playTTS(url) {
    ttsPlaying = true
    player.src = url
    player.play().catch(() => {
      ttsPlaying = false
      if (playlist.length && currentIndex === -1) playSong(0)
    })
  }

  // ── WebSocket ──────────────────────────────────────────────
  const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`)
  ws.onopen  = () => { $('dot').classList.add('on'); $('status-text').textContent = 'live' }
  ws.onclose = () => { $('dot').classList.remove('on'); $('status-text').textContent = 'offline' }
  ws.onmessage = e => {
    const d = JSON.parse(e.data)
    if (d.say)   $('dj-say').textContent = d.say
    if (d.djSay) $('dj-say').textContent = d.djSay

    if (d.type === 'djresponse') {
      if (d.songs?.length) {
        playlist = d.songs
        currentIndex = -1
        renderPlaylist(playlist)
      }
      if (d.ttsUrl) {
        playTTS(d.ttsUrl)
      } else if (d.songs?.length) {
        playSong(0)
      }
    }
  }

  // ── 渲染歌单 ────────────────────────────────────────────────
  function renderPlaylist(songs) {
    $('results').innerHTML = ''
    songs.forEach((song, i) => {
      const row = document.createElement('div')
      row.className = 'song-row'
      row.dataset.index = i
      row.innerHTML = `
        <div class="num">${i + 1}</div>
        <div class="info">
          <div class="s-name">${song.name}</div>
          <div class="s-artist">${song.artist}</div>
        </div>
      `
      row.addEventListener('click', () => playSong(i))
      $('results').appendChild(row)
    })
  }

  // ── 播放 ────────────────────────────────────────────────────
  async function playSong(index) {
    const song = playlist[index]
    if (!song) return
    currentIndex = index

    document.querySelectorAll('.song-row').forEach(r => r.classList.remove('playing'))
    const row = document.querySelector(`.song-row[data-index="${index}"]`)
    if (row) row.classList.add('playing')

    $('song-name').textContent = song.name
    $('song-artist').textContent = song.artist
    $('dj-say').textContent = '加载中...'

    const res = await fetch(`/api/song/${song.id}/url`, { headers: authHeaders() })
    const { url } = await res.json()

    if (!url) {
      $('dj-say').textContent = '这首歌暂无版权，换一首试试'
      return
    }

    fetch('/api/now', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ song })
    })

    player.src = url
    player.play()
    isPlaying = true
    $('btn-play').textContent = '⏸'
    $('dj-say').textContent = `${song.name} — ${song.artist}`
    loadLyrics(song.id)
  }

  // ── 控制 ────────────────────────────────────────────────────
  $('btn-play').addEventListener('click', () => {
    if (!player.src) return
    if (isPlaying) { player.pause(); $('btn-play').textContent = '▶' }
    else           { player.play();  $('btn-play').textContent = '⏸' }
    isPlaying = !isPlaying
  })

  $('btn-next').addEventListener('click', () => {
    if (currentIndex < playlist.length - 1) playSong(currentIndex + 1)
  })
  $('btn-prev').addEventListener('click', () => {
    if (currentIndex > 0) playSong(currentIndex - 1)
  })

  player.addEventListener('ended', () => {
    if (ttsPlaying) {
      ttsPlaying = false
      if (playlist.length && currentIndex === -1) playSong(0)
    } else {
      if (currentIndex < playlist.length - 1) playSong(currentIndex + 1)
    }
  })

  // ── 进度条 ───────────────────────────────────────────────────
  player.addEventListener('timeupdate', () => {
    if (!player.duration) return
    $('progress').value = (player.currentTime / player.duration) * 100
    $('time-cur').textContent = fmt(player.currentTime)
    $('time-total').textContent = fmt(player.duration)
    syncLyrics(player.currentTime)
  })

  function fmt(s) {
    return `${Math.floor(s / 60)}:${Math.floor(s % 60).toString().padStart(2, '0')}`
  }

  // ── 歌词 ────────────────────────────────────────────────────
  let lyrics = []
  let activeLine = -1

  function parseLRC(lrc) {
    const lines = []
    for (const row of lrc.split('\n')) {
      const m = row.match(/\[(\d+):(\d+\.\d+)\](.*)/)
      if (m) {
        const time = parseInt(m[1]) * 60 + parseFloat(m[2])
        const text = m[3].trim()
        if (text) lines.push({ time, text })
      }
    }
    return lines.sort((a, b) => a.time - b.time)
  }

  function renderLyrics() {
    const inner = $('lyric-inner')
    inner.innerHTML = ''
    if (!lyrics.length) {
      inner.innerHTML = '<div class="lyric-line" style="color:#1e0d25">// no lyrics //</div>'
      return
    }
    lyrics.forEach((l, i) => {
      const div = document.createElement('div')
      div.className = 'lyric-line'
      div.dataset.i = i
      div.textContent = l.text
      inner.appendChild(div)
    })
    activeLine = -1
  }

  function syncLyrics(currentTime) {
    if (!lyrics.length) return
    let idx = lyrics.findIndex(l => l.time > currentTime) - 1
    if (idx < 0 && lyrics[0]?.time <= currentTime) idx = lyrics.length - 1
    if (idx === activeLine) return
    activeLine = idx

    document.querySelectorAll('.lyric-line').forEach((el, i) => {
      el.classList.toggle('active', i === idx)
    })

    const panel = $('lyric-panel')
    const inner = $('lyric-inner')
    const activeEl = inner.querySelector(`[data-i="${idx}"]`)
    if (activeEl) {
      const offset = activeEl.offsetTop - panel.clientHeight / 2 + activeEl.clientHeight / 2
      inner.style.transform = `translateY(${-offset}px)`
    }
  }

  async function loadLyrics(songId) {
    lyrics = []
    $('lyric-inner').innerHTML = '<div class="lyric-line" style="color:#1e0d25">加载中...</div>'
    const res = await fetch(`/api/song/${songId}/lyric`)
    const { lyric } = await res.json()
    lyrics = lyric ? parseLRC(lyric) : []
    renderLyrics()
  }

  // ── 聊天 ────────────────────────────────────────────────────
  async function sendChat() {
    const msg = $('chat-input').value.trim()
    if (!msg) return
    $('chat-input').value = ''
    $('dj-say').textContent = '...'
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ message: msg, userTaste })
    })
    const data = await res.json()
    $('dj-say').textContent = data.reply
  }

  $('chat-send').addEventListener('click', sendChat)
  $('chat-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendChat() })

  // 页面加载时检查登录状态
  initLogin()
</script>
</body>
</html>
